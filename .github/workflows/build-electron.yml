name: Build Electron App

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Print Node and npm Version
        run: |
          node --version
          npm --version

      - name: Clean npm cache
        run: npm cache clean --force

      - name: Install Dependencies
        run: npm ci

      - name: Verify Native Dependencies
        run: |
          node -e "console.log('Verifying esbuild, rollup, tailwindcss, lightningcss...'); require('esbuild'); require('rollup'); require('tailwindcss'); require('lightningcss'); console.log('All native / build toolchains verified successfully.');"

      - name: Build Frontend
        run: npm run build

      - name: Build Electron & Package Portable
        run: npm run electron:build
        env:
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: "true"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          FORCE_COLOR: "1"
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PLMSys-Windows-Portable
          path: release/*.exe
