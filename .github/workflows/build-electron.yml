name: Build Electron App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Clean Cache & Install dependencies with npm ci
        shell: bash
        run: |
          npm cache clean --force
          npm ci --include=optional
          node -e "const fs = require('fs'); console.log('Checking optional native bindings for win32-x64:'); ['@esbuild/win32-x64', '@rollup/rollup-win32-x64-msvc', '@tailwindcss/oxide-win32-x64-msvc', 'lightningcss-win32-x64-msvc'].forEach(m => { const exists = fs.existsSync('node_modules/' + m); console.log(m, exists ? 'EXISTS' : 'MISSING'); });"

      - name: Build and Package Electron App
        shell: bash
        run: |
          npm run build
          npm run electron:build
        env:
          CI: true
          USE_HARD_LINKS: "false"
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: "true"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-build-${{ matrix.os }}
          path: release/**/*

