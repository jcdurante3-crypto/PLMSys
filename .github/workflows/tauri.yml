name: Tauri Windows Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-tauri-windows:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci --include=optional

      - name: Build frontend
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate Windows ICO resource file
        run: python scripts/validate-ico.py src-tauri/icons/icon.ico

      - name: Build Tauri App & Draft Release
        uses: tauri-apps/tauri-action@v0
        id: tauri_build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npm run tauri
          projectPath: .
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: 'Plate Lifecycle Management System v__VERSION__'
          releaseBody: 'Windows desktop release for Plate Lifecycle Management System.'
          releaseDraft: true
          prerelease: false
          args: --target x86_64-pc-windows-msvc

      - name: Prepare Portable Windows Package
        shell: bash
        run: |
          mkdir -p PortableApp/data PortableApp/backups PortableApp/exports PortableApp/logs
          cp src-tauri/target/x86_64-pc-windows-msvc/release/plate-lifecycle-management-system.exe PortableApp/PlateLifecycle.exe || cp src-tauri/target/release/plate-lifecycle-management-system.exe PortableApp/PlateLifecycle.exe
          cd PortableApp && zip -r ../PlateLifecycle-Portable-Windows-x64.zip . && cd ..

      - name: Upload Portable Windows Zip Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tauri-windows-portable-zip
          path: PlateLifecycle-Portable-Windows-x64.zip
          if-no-files-found: warn

      - name: Upload Windows Installer Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tauri-windows-installer
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
