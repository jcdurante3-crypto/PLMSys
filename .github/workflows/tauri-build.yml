name: "Tauri 2 Windows Build"

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build-tauri-windows:
    name: Build Windows Application
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install app dependencies
        shell: bash
        run: |
          node -v
          npm -v
          dir
          npm install --include=optional
          dir

      - name: Build frontend
        shell: bash
        env:
          CI: false
          NODE_ENV: production
        run: |
          node -v
          npm -v
          dir
          npm run build
          dir
          dir dist

      - name: Check Rust Tauri backend
        shell: bash
        working-directory: src-tauri
        run: |
          rustc -V
          cargo -V
          cargo check --verbose

      - name: Build Tauri Windows App
        shell: bash
        env:
          CI: false
          NODE_ENV: production
          RUST_BACKTRACE: 1
          RUST_LOG: debug
          CARGO_TERM_VERBOSE: true
        run: |
          npx tauri build --verbose

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PLMSys-Windows-x64
          path: |
            src-tauri/target/release/plmsys.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/**/*
          if-no-files-found: warn
