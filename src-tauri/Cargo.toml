[package]
name = "plmsys"
version = "1.0.0"
description = "Plate Lifecycle Monitoring System - Tauri 2 Application"
authors = ["J.Durante"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
walkdir = "2.3"
tempfile = "3.3"
sha2 = "0.10"
hex = "0.4"
open = "5.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
