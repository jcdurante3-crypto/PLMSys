[package]
name = "plate-lifecycle-management-system"
version = "0.1.0"
description = "Plate Lifecycle Management System Desktop App"
authors = ["Admin"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
